[tool.ruff]
# Google Python Style Guide section 3.2.
line-length = 80
target-version = "py311"
extend-exclude = [
    "archive",
    "data/matlab_reference",
    "experiments",
    "related-papers",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "D",    # pydocstyle (Google docstrings)
    "N",    # pep8-naming
    "PL",   # Pylint rules that Ruff implements
    "C90",  # McCabe complexity
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",  # function call in default arg — common in scientific Python
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe the case, so test methods need no docstring.
# Expected values in assertions are not magic numbers.
"tests/**" = ["B011", "D1", "PLR2004"]
"notebooks/**" = ["E402", "F401"]  # imports often staged across cells

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
