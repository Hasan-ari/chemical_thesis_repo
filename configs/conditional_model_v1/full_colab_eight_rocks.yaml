experiment:
  name: eight_rocks_condition_lstm_v1
  run_root: ${RUN_ROOT}

data:
  processed_root: ${PROCESSED_ROOT}
  cache_name: eight_rocks_v1
  require_cache: true
  use_cache: true
  rebuild_cache: false
  write_outputs_csv: false
  # input_units declares the units of the solution scalars in each dataset's
  # *_Input.txt files. The schist .phr templates use `units mg/L`; the loader
  # converts them to mol/kgw (see conditional_model_v1/units.py). SI and
  # ALKALINITY factors are derived from phreeqc.dat / the .phr `as SO4-2` line
  # and not yet cross-checked against the professor's converted files.
  datasets:
    - name: Calcite_wat_sat_data_3
      rock: Calcite
      path: ${DATA_ROOT}/wat_sat/Calcite/Calcite_wat_sat_data_3
    - name: Dolomite_wat_sat_data_2
      rock: Dolomite
      path: ${DATA_ROOT}/wat_sat/Dolomite/Dolomite_wat_sat_data_2
    - name: Halite_wat_sat_data_2
      rock: Halite
      path: ${DATA_ROOT}/wat_sat/Halite/Halite_wat_sat_data_2
    - name: Trona_par_sat_data_3
      rock: Trona
      path: ${DATA_ROOT}/wat_sat/Trona/Trona_par_sat_data_3
    - name: Sandstone_data_2
      rock: Sandstone
      path: ${DATA_ROOT}/new_data/Sandstone_data_2
    - name: Quarzite_schist_low_t
      rock: Quartzite_schist
      path: ${DATA_ROOT}/new_data/Quarzite_schist_low_t
      input_units: mg_L
    - name: Mica_schist_low_t
      rock: Mica_schist
      path: ${DATA_ROOT}/new_data/Mica_schist_low_t
      input_units: mg_L
    - name: Mica_carbonate_schist_low_t
      rock: Mica_carbonate_schist
      path: ${DATA_ROOT}/new_data/Mica_carbonate_schist_low_t
      input_units: mg_L
  split:
    strategy: rock_aware_run_level
    train: 0.8
    val: 0.1
    test: 0.1
    seed: 42

model:
  hidden_size: 128
  num_layers: 2
  dropout: 0.0

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  num_workers: 2
  preprocessing_chunk_runs: 256
  seed: 42
  scheduler:
    type: none

plots:
  max_runs: 0
  features: all
